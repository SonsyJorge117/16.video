<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jorge Jimenez">
    <meta name="robots" content="index, content">
    <meta name="keywords" content="manejo, de, HTML5">
    <meta charset="UTF-8">
    <meta name="description" content="Video, Audio e Iframes con HTML5">
    <meta http-equiv="refresh" content="30">
    <title>Video, Audio e Iframes con HTML5</title>
    <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
</head>
<body>
    <h1>Manejo de video en HTML5</h1>
    <video controls poster="images (1).jpeg" autoplay loop width="400">
        <source src="Publicar20s.mp4" type="video/mp4">
    </video>
    <h1>Manejo de Audio</h1>
    <audio controls autoplay style="width: 500px;">
        <source src="audio.mp3" type="audio/mp3">
    </audio>
    <h1>Etiqueta Iframe</h1>
    <h2>Periodicos del Dia</h2>
    <iframe src="https://elpais.com/" height="400" frameborder="0"></iframe> <hr>
    <iframe src="https://www.elmundo.es/" height="400" frameborder="0"></iframe>
    <h2>Video de YouTube</h2>
    <h1>Video del Ies Juan bosco</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/eKabc74IU7o?si=02mh69ZXusIUP7s5" title="video de YouTube" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h2>Mapa de Google Maps</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3083.442383781076!2d-3.224483325184358!3d39.391496571622724!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd69af036cec6af9%3A0x3cb32e283081ecee!2sIES%20Juan%20Bosco!5e0!3m2!1ses!2ses!4v1761657186043!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

</body>
</html>
